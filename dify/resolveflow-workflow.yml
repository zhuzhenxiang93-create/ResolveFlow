      data:
        type: code
        title: 汇总各 Agent 实际结果
        code_language: python3
        code: "import json,re\ndef main(proposal:str,agent_plan:str,commerce:str,general:str,technical:str,billing:str,escalation:str):\n\
          \ p=json.loads(proposal);plan=json.loads(agent_plan);results=[];sources=[];traces=[]\n\
          \ for role,raw in [(\"commerce\",commerce),(\"general\",general),(\"technical\"\
          ,technical),(\"billing\",billing),(\"escalation\",escalation)]:\n  if role\
          \ not in plan:continue\n  try:\n   raw=raw.strip()\n   if raw.startswith(\"\
          ```\"):raw=re.sub(r\"^```(?:json)?\\s*|\\s*```$\",\"\",raw)\n   a=json.loads(raw)\n\
          \   if not isinstance(a,dict) or not isinstance(a.get(\"answer\"),str):raise\
          \ ValueError()\n   result={\"agent_type\":role,\"answer\":a[\"answer\"],\"\
          status\":\"completed\"}\n   for s in a.get(\"sources\",[]):\n    if isinstance(s,dict)\
          \ and s not in sources:sources.append(s)\n   for t in a.get(\"tool_traces\"\
          ,[]):\n    if not isinstance(t,dict) or not isinstance(t.get(\"tool\"),str)\
          \ or not isinstance(t.get(\"success\"),bool) or not isinstance(t.get(\"\
          arguments\"),dict) or not isinstance(t.get(\"result\"),dict):raise ValueError(\"\
          Invalid tool trace\")\n    traces.append({**t,\"agent_type\":role})\n  except\
          \ (ValueError,TypeError,AttributeError):result={\"agent_type\":role,\"answer\"\
          :\"该 Agent 返回格式异常，请重试。\",\"status\":\"failed\"}\n  results.append(result)\n\
          \ policy=\"\\n\\n\".join(a[\"answer\"] for a in results if a[\"agent_type\"\
          ]==\"general\")\n support=\"\\n\\n\".join(a[\"agent_type\"].title()+\" Agent：\\\
          n\"+a[\"answer\"] for a in results if a[\"agent_type\"] in {\"technical\"\
          ,\"billing\",\"escalation\"})\n return {\"proposal\":proposal,\"policy_answer\"\
          :policy,\"support_answer\":support,\"sources\":json.dumps(sources,ensure_ascii=False),\"\
          tool_traces\":json.dumps(traces,ensure_ascii=False),\"agent_plan\":agent_plan,\"\
          agent_results\":json.dumps(results,ensure_ascii=False)}\n"
        variables:
        - variable: proposal
          value_selector:
          - parse
          - proposal
        - variable: agent_plan
          value_selector:
          - parse
          - agent_plan
        - variable: commerce
          value_selector:
          - commerce_result
          - output
        - variable: general
          value_selector:
          - general_result
          - output
        - variable: technical
