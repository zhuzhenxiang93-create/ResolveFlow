name: Multi-intent orchestration checks

on:
  pull_request:
    branches: [main]
    paths:
      - "ResolveFlow/**"
      - ".github/workflows/multi-intent-orchestration.yml"
  workflow_dispatch:

jobs:
  unit-and-control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ResolveFlow/requirements.txt
      - name: Install project requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ResolveFlow/requirements.txt
      - name: Run multi-intent and DAG tests
        working-directory: ResolveFlow
        run: |
          python -m unittest discover -s tests -p 'test_multi_intent_routing.py' -v
          python -m unittest discover -s tests -p 'test_supervisor.py' -v
          python -m unittest discover -s tests -p 'test_conversation_intent_merge.py' -v
      - name: Compile project and run commerce safety regressions
        working-directory: ResolveFlow
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -p 'test_action_safety.py' -v
          python -m unittest discover -s tests -p 'test_commerce.py' -v
          python -m unittest discover -s tests -p 'test_compound_requests.py' -v
          python -m unittest discover -s tests -p 'test_unified_conversation.py' -v
          python -m unittest discover -s tests -p 'test_native_tools.py' -v
      - name: Run explicit multi-intent control-plane regression
        working-directory: ResolveFlow
        run: python scripts/run_supervisor_eval.py
